<!DOCTYPE html>

<html>

<head>

    <title>Itinerary Builder</title>

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet">

</head>

<body class="container mt-5">

<h1>
    {{ trip.title }} - Itinerary Builder
</h1>

<hr>

<h3>Add Stop</h3>

<form method="POST">

    {% csrf_token %}

    {{ stop_form.as_p }}

    <button class="btn btn-primary">
        Add Stop
    </button>

</form>

<hr>

<h3>Trip Stops</h3>

{% for stop in stops %}

<div class="card mb-3">

    <div class="card-body">

        <h4>{{ stop.city }}</h4>

        <p>
            {{ stop.start_date }}
            →
            {{ stop.end_date }}
        </p>

        <a
        href="/activity/{{ stop.id }}/"
        class="btn btn-success">

            Add Activity

        </a>

    </div>

</div>

{% endfor %}

</body>

</html>
