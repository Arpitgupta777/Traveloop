<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traveloop MVP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <header class="d-flex justify-content-between align-items-center pb-3 mb-4 border-bottom">
        <h1 class="h3 text-primary">✈️ Traveloop</h1>
        <button class="btn btn-success">+ Plan New Trip</button>
    </header>

    <h2 class="h5 mb-3">Your Upcoming Trips</h2>
    
    <div class="row" id="trip-container">
        <div class="col-md-4 mb-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Euro Trip 2026</h5>
                    <h6 class="card-subtitle mb-2 text-muted">Paris -> Rome</h6>
                    <p class="card-text">Dates: June 10 - June 20</p>
                    <p class="card-text"><strong>Total Est: $1,200</strong></p>
                    <button class="btn btn-outline-primary btn-sm">View Itinerary</button>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
