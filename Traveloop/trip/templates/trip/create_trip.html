{% extends 'trip/base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white p-8 rounded-2xl shadow-sm border border-gray-200 mt-8">
    <h1 class="text-3xl font-extrabold text-gray-900 mb-6 pb-4 border-b border-gray-200"><i class="fa-solid fa-map-location-dot text-indigo-500 mr-2"></i> Plan a New Trip</h1>
    
    <form method="POST">
        {% csrf_token %} 
        {{ form.as_p }}
        
        <div class="mt-8 flex items-center space-x-4">
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-lg shadow transition">Save Trip</button>
            <a href="{% url 'dashboard' %}" class="text-gray-500 hover:text-gray-800 font-medium transition">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
