<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Traveloop{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style type="text/tailwindcss">
        @layer base {
            input[type="text"], input[type="password"], input[type="email"], input[type="number"], input[type="date"], select, textarea {
                @apply w-full border border-gray-300 rounded-lg shadow-sm px-4 py-2 mt-1 mb-4 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition-colors;
            }
            label {
                @apply block text-sm font-semibold text-gray-700 mb-1;
            }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

    <nav class="bg-indigo-900 text-white shadow-lg sticky top-0 z-50">
       <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
           <div class="flex justify-between h-16 items-center">
                <div class="flex items-center space-x-8">
                    <a href="{% url 'home' %}" class="text-2xl font-extrabold tracking-tight hover:text-indigo-200 transition flex items-center">
                        <i class="fa-solid fa-plane-departure mr-2"></i> Traveloop
                    </a>
                    <a href="{% url 'community' %}" class="text-indigo-100 hover:text-white font-medium transition flex items-center">
                        <i class="fa-solid fa-earth-americas mr-2"></i> Community
                    </a>
                </div>
                
                <div class="flex items-center space-x-6">
                    {% if user.is_authenticated %}
                        <a href="{% url 'profile' %}" class="flex items-center bg-indigo-800 hover:bg-indigo-700 px-4 py-1.5 rounded-full transition text-sm font-medium shadow-inner border border-indigo-700">
                            {% if user.userprofile.profile_picture %}
                                <img src="{{ user.userprofile.profile_picture.url }}" class="w-7 h-7 rounded-full object-cover mr-2 border-2 border-indigo-300">
                            {% else %}
                                <i class="fa-solid fa-circle-user text-xl mr-2 text-indigo-300"></i>
                            {% endif %}
                            {{ user.username }}
                        </a>
                        <a href="{% url 'dashboard' %}" class="text-indigo-100 hover:text-white font-medium transition">Dashboard</a>
                        <form action="{% url 'logout' %}" method="post" class="inline m-0 p-0">
                            {% csrf_token %}
                            <button type="submit" class="text-red-400 hover:text-red-300 font-bold transition flex items-center">
                                <i class="fa-solid fa-right-from-bracket mr-1"></i> Logout
                            </button>
                        </form>
                    {% else %}
                        <a href="{% url 'login' %}" class="text-indigo-100 hover:text-white font-medium transition">Login</a>
                        <a href="{% url 'register' %}" class="bg-teal-500 hover:bg-teal-400 text-white px-5 py-2 rounded-lg font-bold transition shadow-md">Sign Up</a>
                    {% endif %}
                </div>
           </div>
       </div>
    </nav>

    <main class="flex-grow max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-10">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="bg-white border-t border-gray-200 text-gray-500 text-center py-6 mt-auto">
        <p class="mb-0 text-sm">&copy; 2026 Traveloop. Plan your next adventure.</p>
    </footer>

</body>
</html>
