<!DOCTYPE html>
<html>
<head>
    <title>Login - Traveloop</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f4f4; margin: 0; }
        .auth-card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
        .btn { width: 100%; padding: 10px; background: #007BFF; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>
    <div class="auth-card">
        <h1>✈️ Traveloop</h1>
        <p>Welcome back! Please log in.</p>
        
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn">Login</button>
        </form>
        <a href="{% url 'password_reset' %}">Forgot Password?</a>
        <p style="margin-top: 15px; font-size: 0.9em;">
            Don't have an account? <a href="{% url 'register' %}">Sign up</a>
        </p>
    </div>
</body>
</html>
