<!DOCTYPE html>
<html>
<head>
    <title>Register - Traveloop</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f4f4; margin: 0; }
        .auth-card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 350px; text-align: center; }
        input { width: 90%; padding: 8px; margin: 5px 0; border: 1px solid #ccc; border-radius: 4px; }
        .btn { width: 100%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 15px;}
    </style>
</head>
<body>
    <div class="auth-card">
        <h1>🎒 Join Traveloop</h1>
        <p>Create an account to start planning.</p>
        
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn">Register</button>
        </form>
        <p style="margin-top: 15px; font-size: 0.9em;">
            Already have an account? <a href="{% url 'login' %}">Log in</a>
        </p>
    </div>
</body>
</html>
