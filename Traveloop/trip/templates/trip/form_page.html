<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - Traveloop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style type="text/tailwindcss">
        @layer base {
            input, select, textarea {
                @apply w-full border border-gray-300 rounded-lg shadow-sm px-4 py-2 mt-1 mb-5 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition;
            }
            label { @apply block text-sm font-semibold text-gray-700 mb-1; }
        }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen font-sans p-4">

    <div class="bg-white p-8 md:p-10 rounded-2xl shadow-lg w-full max-w-lg border border-gray-200">
        <h1 class="text-2xl font-bold text-gray-900 mb-6 pb-4 border-b border-gray-200">{{ title }}</h1>
        
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="mt-6">
                <button type="submit" class="w-full bg-teal-500 hover:bg-teal-600 text-white font-bold py-3 px-4 rounded-lg shadow transition">Save</button>
            </div>
        </form>
    </div>

</body>
</html>
