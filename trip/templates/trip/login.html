<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Traveloop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style type="text/tailwindcss">
        @layer base {
            input[type="text"], input[type="password"] {
                @apply w-full border border-gray-300 rounded-lg shadow-sm px-4 py-3 mt-1 mb-5 focus:ring-indigo-500 focus:border-indigo-500 transition;
            }
            label { @apply block text-sm font-semibold text-gray-700 mb-1 text-left; }
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen font-sans">
    
    <div class="bg-white p-10 rounded-2xl shadow-xl w-full max-w-md border border-gray-200 text-center">
        <h1 class="text-3xl font-extrabold text-indigo-900 mb-2"><i class="fa-solid fa-plane-departure mr-2"></i>Traveloop</h1>
        <p class="text-gray-500 mb-8">Welcome back! Please log in.</p>
        
        <form method="POST" class="text-left">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg shadow-md transition mt-2 text-lg">Login</button>
        </form>
        
        <div class="mt-6 flex flex-col space-y-2">
            <a href="{% url 'password_reset' %}" class="text-sm text-indigo-600 hover:text-indigo-800 font-medium">Forgot Password?</a>
            <p class="text-sm text-gray-600">
                Don't have an account? <a href="{% url 'register' %}" class="text-teal-600 hover:text-teal-800 font-bold">Sign up</a>
            </p>
        </div>
    </div>

</body>
</html>
