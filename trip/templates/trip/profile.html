{% extends 'trip/base.html' %}
{% block content %}
<div class="max-w-3xl mx-auto bg-white p-8 rounded-2xl shadow-sm border border-gray-200 mt-8">
    <h1 class="text-3xl font-extrabold text-gray-900 mb-6 pb-4 border-b border-gray-200"><i class="fa-solid fa-user-pen text-indigo-500 mr-2"></i> Edit Profile</h1>
    
    <form method="POST" enctype="multipart/form-data" class="space-y-8">
        {% csrf_token %}
        
        <div>
            <h3 class="text-xl font-bold text-gray-800 mb-4">Account Details</h3>
            <div class="bg-gray-50 p-6 rounded-xl border border-gray-100">
                {{ u_form.as_p }}
            </div>
        </div>
        
        <div>
            <h3 class="text-xl font-bold text-gray-800 mb-4">Profile Picture</h3>
            <div class="bg-gray-50 p-6 rounded-xl border border-gray-100 flex flex-col items-start">
                {% if user.userprofile.profile_picture %}
                    <img src="{{ user.userprofile.profile_picture.url }}" class="w-32 h-32 rounded-full object-cover shadow-md mb-4 border-4 border-white">
                {% endif %}
                <div class="w-full">
                    {{ p_form.as_p }}
                </div>
            </div>
        </div>
        
        <div class="pt-4 border-t border-gray-200">
            <button type="submit" class="w-full md:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-8 rounded-lg shadow-md transition text-lg">Update Profile</button>
        </div>
    </form>
</div>
{% endblock %}
